name: Aggiorna Bobo Movies Night
on:
  push:
    branches: [main]
  schedule:
    - cron: '35 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bobo-pages
  cancel-in-progress: false
jobs:
  catalogo:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - run: python3 update.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Attendi disponibilità del pacchetto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 10
          done
          exit 1
      - uses: actions/deploy-pages@v4
