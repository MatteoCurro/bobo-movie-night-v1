name: Aggiorna Bobo Movies Night
on:
  push:
    branches: [main]
  schedule:
    - cron: '35 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bobo-pages
  cancel-in-progress: false
jobs:
  catalogo:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - run: python3 update.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
